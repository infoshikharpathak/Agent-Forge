name: Publish

# On a v* tag: build, test the built wheel, publish to TestPyPI, then to
# PyPI once someone approves the "pypi" environment's deployment.
# Trusted Publishing (OIDC): no API tokens are stored anywhere. Each index
# needs a (pending) publisher for this repository, this workflow file and
# the environment named below.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
      - name: Build
        run: |
          pip install build twine
          python -m build --outdir dist
          twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install the built wheel
        run: pip install "$(ls dist/*.whl)[dev]"
      - name: Test against the installed wheel
        env:
          OPENAI_API_KEY: dummy-key-for-ci
          ANTHROPIC_API_KEY: dummy-key-for-ci
        run: |
          rm -rf src   # so the tests import the installed wheel, not the checkout
          pytest -q

  publish-testpypi:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/garrison-forge
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Re-running a partly failed release skips files already uploaded.
          skip-existing: true

  publish-pypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    # Give this environment required reviewers in the repository settings:
    # the job waits for that manual approval.
    environment:
      name: pypi
      url: https://pypi.org/p/garrison-forge
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Re-running a partly failed release skips files already uploaded.
          skip-existing: true
