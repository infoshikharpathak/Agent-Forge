name: CI

# Runs the pytest suite. Dummy API keys are set only so SDK clients can be
# constructed; tests stub every model call, so no network calls are made.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Import smoke test
        env:
          OPENAI_API_KEY: dummy-key-for-ci
        run: python -c "import agent_forge; print('agent_forge imports cleanly')"

      - name: Tests
        env:
          OPENAI_API_KEY: dummy-key-for-ci
          ANTHROPIC_API_KEY: dummy-key-for-ci
        run: pytest -q
